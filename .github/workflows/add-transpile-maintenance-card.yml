name: Add transpile maintenance card

on:
  push:
    paths:
      - .github/workflows/add-transpile-maintenance-card.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add architecture card once
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          href = 'arch/openhands-transpile-maintenance.html'
          if href not in text:
              anchor = '<div class="cards">'
              if anchor not in text:
                  raise SystemExit('Architecture card container not found')
              card = '''
              <a class="card" href="arch/openhands-transpile-maintenance.html">
                <div class="card-title">Maintaining the OpenHands TypeScript transpiles</div>
                <div class="card-desc">The living maintenance map: one canonical pin, bounded drift intervals, tests-first porting, generated Python OpenAPI oracles, SDK wire goldens, and clear policy for deviations and exclusions.</div>
                <span class="card-tag tag-report">OpenHands · transpilation</span>
              </a>
              '''
              text = text.replace(anchor, anchor + '\n' + card, 1)
              index.write_text(text)
          PY

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/add-transpile-maintenance-card.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/add-transpile-maintenance-card.yml index.html
          if git diff --cached --quiet; then
            echo "Transpile maintenance card is already present."
            exit 0
          fi
          git commit -m "arch: surface transpile maintenance map"
          git pull --rebase origin main
          git push
