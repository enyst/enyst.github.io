<script>
/*
 * "The map that keeps itself honest": a short film about the verify-agent-server
 * skill (OpenHands/software-agent-sdk PR #5621).
 *
 * Every frame is a pure function of time: renderFrame(t) draws the moment t
 * (seconds) from scratch, so any frame can be rendered alone, in any order.
 * Scene timings and the Lasseter principle each one leans on are listed in
 * storyboard.md; comments below name the principle where it is applied.
 */
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  bg: '#0f0f0e', card: '#1a1a18', card2: '#141413', border: '#2a2a26',
  ink: '#e5e0d8', muted: '#8a847a', gold: '#c9a84c', mint: '#6bbfab',
  green: '#7bc47f', red: '#dc6b4a',
};
const F = { serif: '"Instrument Serif"', sans: '"DM Sans"', mono: '"JetBrains Mono"' };

// ── math, easing (slow in / slow out everywhere) ──────────────────────────
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
const io = (t, a, b) => E.io(prog(t, a, b));
const out = (t, a, b) => E.out(prog(t, a, b));
const back = (t, a, b) => E.back(prog(t, a, b));
// Follow-through: a damped spring that settles on 0 after an impulse at t0.
const wobble = (t, t0, amp = 1, f = 2.2, d = 4) => t < t0 ? 0 : amp * Math.exp(-d * (t - t0)) * Math.sin(2 * Math.PI * f * (t - t0));
// Overshoot-and-settle scale for counters and cards (follow-through).
const settle = (t, t0, amp = .12) => 1 + wobble(t, t0, amp, 2.4, 5);

function rng(seed) { // mulberry32, so every "random" layout is the same each frame
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }

// ── drawing helpers ───────────────────────────────────────────────────────
function font(o) { return `${o.italic ? 'italic ' : ''}${o.w || 400} ${o.size || 40}px ${o.font || F.sans}`; }
function text(s, x, y, o = {}) {
  ctx.save();
  ctx.globalAlpha = o.a ?? 1;
  ctx.font = font(o);
  ctx.fillStyle = o.c || C.ink;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  ctx.letterSpacing = (o.ls || 0) + 'px';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowBlur || 24; }
  ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, o = {}) { ctx.save(); ctx.font = font(o); ctx.letterSpacing = (o.ls || 0) + 'px'; const w = ctx.measureText(s).width; ctx.restore(); return w; }
function wrap(s, maxW, o) {
  const words = s.split(' '), lines = []; let cur = '';
  for (const w of words) { const n = cur ? cur + ' ' + w : w; if (measure(n, o) > maxW && cur) { lines.push(cur); cur = w; } else cur = n; }
  if (cur) lines.push(cur); return lines;
}
function para(s, x, y, maxW, o = {}) {
  const lines = wrap(s, maxW, o), lh = o.lh || (o.size || 40) * 1.3;
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}
function ellipsize(s, maxW, o) { if (measure(s, o) <= maxW) return s; while (s.length && measure(s + '…', o) > maxW) s = s.slice(0, -1); return s + '…'; }
// Draw [[text, color, extra], ...] in one run; returns end x.
function segs(list, x, y, o = {}) {
  let cx = x;
  for (const [s, c, ex] of list) { const oo = { ...o, c, ...(ex || {}) }; text(s, cx, y, oo); cx += measure(s, oo); }
  return cx;
}
function rrect(x, y, w, h, r, fill, stroke, lw = 2, a = 1) {
  ctx.save(); ctx.globalAlpha = a; ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  ctx.restore();
}
function circle(x, y, r, fill, stroke, lw = 2, a = 1) {
  ctx.save(); ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  ctx.restore();
}
function glowDot(x, y, r, color, a = 1) {
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, hexA(color, .55)); g.addColorStop(1, hexA(color, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore();
}
// Quadratic arc between two points; bend > 0 bows left of travel (arcs, not straight lines).
function arcPoint(x0, y0, x1, y1, bend, p) {
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, dx = x1 - x0, dy = y1 - y0;
  const cx = mx - dy * bend, cy = my + dx * bend;
  const q = 1 - p;
  return [q * q * x0 + 2 * q * p * cx + p * p * x1, q * q * y0 + 2 * q * p * cy + p * p * y1];
}
function drawArc(x0, y0, x1, y1, bend, p, color, lw = 3, a = 1, dash) {
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); const n = 48;
  for (let i = 0; i <= n * p; i++) { const [x, y] = arcPoint(x0, y0, x1, y1, bend, i / n); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke(); ctx.restore();
}
function typed(s, lt, t0, cps = 55) { return s.slice(0, Math.max(0, Math.floor((lt - t0) * cps))); }
function caret(x, y, size, lt, color = C.gold, a = 1) {
  if (Math.floor(lt * 2.2) % 2 === 0) rrect(x + 3, y - size * .82, size * .55, size * .98, 2, color, null, 0, a);
}
function chip(label, x, y, o = {}) {
  const size = o.size || 26, padX = o.padX || 18, h = o.h || size * 1.75;
  const w = measure(label, { font: o.font || F.mono, size, w: o.w || 600, ls: o.ls }) + padX * 2;
  const s = o.scale ?? 1, cx = x + (o.align === 'center' ? 0 : w / 2), cy = y + h / 2;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-w / 2, -h / 2);
  rrect(0, 0, w, h, h / 2, hexA(o.color || C.gold, o.fillA ?? .16), o.color || C.gold, 2, o.a ?? 1);
  text(label, padX, h / 2 + size * .36, { font: o.font || F.mono, size, w: o.w || 600, c: o.textC || o.color || C.gold, a: o.a ?? 1, ls: o.ls });
  ctx.restore();
  return w;
}

// ── background: dark workshop, lamplight glow, paper noise ────────────────
const noise = document.createElement('canvas'); noise.width = noise.height = 256;
{ const n = noise.getContext('2d'), img = n.createImageData(256, 256), r = rng(7);
  for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  n.putImageData(img, 0, 0); }
let noisePattern = null;
function background(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const lx = 960 + Math.sin(t * .13) * 120, ly = 470 + Math.cos(t * .11) * 40;
  const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, 1100);
  g.addColorStop(0, 'rgba(201,168,76,0.075)'); g.addColorStop(.5, 'rgba(201,168,76,0.025)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (!noisePattern) noisePattern = ctx.createPattern(noise, 'repeat');
  ctx.save(); ctx.globalAlpha = .035; ctx.fillStyle = noisePattern; ctx.fillRect(0, 0, W, H); ctx.restore();
  const v = ctx.createRadialGradient(960, 540, 500, 960, 540, 1250);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// ── the character: a small folded paper map with a gold pin ───────────────
// Appeal: big readable eyes, simple silhouette, a pin that wobbles with
// follow-through. Squash and stretch keep its volume (x scales by 1/sqrt(sq)).
function mappy(o) {
  const { x, y, s = 1, sq = 1, look = [0, 0], blink = 0, unfold = 1, mood = 'smile', wave = null,
          pin = 0, tilt = 0, a = 1, airY = 0, armL = 0 } = o;
  ctx.save(); ctx.globalAlpha = a;
  // contact shadow shrinks as it leaves the ground
  const k = 1 / (1 + Math.abs(airY) / (160 * s));
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath();
  ctx.ellipse(x, y + 3 * s, 78 * s * k * lerp(.45, 1, unfold) / Math.sqrt(sq), 11 * s * k, 0, 0, Math.PI * 2); ctx.fill();
  ctx.translate(x, y + airY); ctx.rotate(tilt); ctx.scale(s / Math.sqrt(sq), s * sq);
  const bw = lerp(58, 150, unfold), bh = lerp(58, 168, unfold), legL = lerp(3, 24, unfold);
  const top = -legL - bh;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // legs and feet
  ctx.strokeStyle = C.ink; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(-bw * .2, -legL - 2); ctx.lineTo(-bw * .22, -2); ctx.moveTo(bw * .2, -legL - 2); ctx.lineTo(bw * .22, -2); ctx.stroke();
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.ellipse(-bw * .22 - 6, -2, 13, 6, 0, 0, Math.PI * 2); ctx.ellipse(bw * .22 + 6, -2, 13, 6, 0, 0, Math.PI * 2); ctx.fill();
  // arms (left rests, right can wave on an arc)
  if (unfold > .5) {
    ctx.lineWidth = 6; ctx.strokeStyle = C.ink;
    const ay = top + bh * .55;
    ctx.beginPath(); ctx.moveTo(-bw / 2 + 2, ay);
    const la = 1.95 + armL; ctx.lineTo(-bw / 2 + 2 + Math.cos(la) * 44, ay + Math.sin(la) * 44); ctx.stroke();
    const ra = wave === null ? 1.2 : -wave;
    ctx.beginPath(); ctx.moveTo(bw / 2 - 2, ay); ctx.lineTo(bw / 2 - 2 + Math.cos(ra) * 46, ay + Math.sin(ra) * 46); ctx.stroke();
  }
  // body: three folded panels
  ctx.save(); ctx.beginPath(); ctx.roundRect(-bw / 2, top, bw, bh, 6 + 6 * unfold); ctx.clip();
  const shades = ['#ece6da', '#d8cfbf', '#e4ddcf'];
  for (let i = 0; i < 3; i++) { ctx.fillStyle = shades[i]; ctx.fillRect(-bw / 2 + i * bw / 3 - .5, top, bw / 3 + 1, bh); }
  // fold shading gradients for depth
  for (let i = 1; i < 3; i++) {
    const fx = -bw / 2 + i * bw / 3, g = ctx.createLinearGradient(fx - 10, 0, fx + 10, 0);
    g.addColorStop(0, 'rgba(90,70,40,0)'); g.addColorStop(.5, 'rgba(90,70,40,0.22)'); g.addColorStop(1, 'rgba(90,70,40,0)');
    ctx.fillStyle = g; ctx.fillRect(fx - 10, top, 20, bh);
  }
  // map doodles: contour rings, a dotted trail, an X
  ctx.globalAlpha = a * clamp(unfold * 1.4 - .3);
  ctx.strokeStyle = 'rgba(107,191,171,0.55)'; ctx.lineWidth = 2;
  for (let r = 10; r <= 26; r += 8) { ctx.beginPath(); ctx.ellipse(-bw * .3, top + bh * .78, r * 1.3, r * .8, -.3, 0, Math.PI * 2); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(120,95,60,0.75)'; ctx.lineWidth = 3; ctx.setLineDash([2, 7]);
  ctx.beginPath(); ctx.moveTo(-bw * .42, top + bh * .95); ctx.bezierCurveTo(-bw * .1, top + bh * .62, bw * .05, top + bh * 1.02, bw * .3, top + bh * .8); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = C.red; ctx.lineWidth = 4;
  const X = bw * .3, Y = top + bh * .8;
  ctx.beginPath(); ctx.moveTo(X - 7, Y - 7); ctx.lineTo(X + 7, Y + 7); ctx.moveTo(X + 7, Y - 7); ctx.lineTo(X - 7, Y + 7); ctx.stroke();
  ctx.globalAlpha = a;
  ctx.restore();
  // face
  const ey = top + bh * (unfold > .5 ? .34 : .45), ex = bw * .18, er = lerp(7, 15.5, unfold);
  const wow = mood === 'wow';
  for (const sx of [-1, 1]) {
    const cx = sx * ex, ry = er * 1.18 * (1 - .92 * blink) * (wow ? 1.15 : 1);
    ctx.fillStyle = '#fbf8f2'; ctx.strokeStyle = '#2b2620'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(cx, ey, er * (wow ? 1.1 : 1), Math.max(1.2, ry), 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (blink < .6) {
      const pr = er * (wow ? .42 : .56);
      const px = cx + look[0] * er * .42, py = ey + look[1] * er * .4;
      ctx.fillStyle = '#16130f'; ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px - pr * .35, py - pr * .4, pr * .32, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (unfold > .4) {
    // cheeks
    ctx.fillStyle = 'rgba(220,107,74,0.28)';
    ctx.beginPath(); ctx.ellipse(-ex - 8, ey + 26, 12, 7, 0, 0, Math.PI * 2); ctx.ellipse(ex + 8, ey + 26, 12, 7, 0, 0, Math.PI * 2); ctx.fill();
    // mouth
    const my = ey + 30; ctx.strokeStyle = '#2b2620'; ctx.lineWidth = 3.5; ctx.fillStyle = '#3a2a22';
    if (mood === 'smile') { ctx.beginPath(); ctx.arc(0, my - 6, 11, .2 * Math.PI, .8 * Math.PI); ctx.stroke(); }
    else if (mood === 'grin') { ctx.beginPath(); ctx.moveTo(-15, my - 2); ctx.quadraticCurveTo(0, my + 22, 15, my - 2); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    else if (wow) { ctx.beginPath(); ctx.ellipse(0, my + 2, 7, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
    else if (mood === 'focus') { ctx.beginPath(); ctx.moveTo(-8, my); ctx.lineTo(8, my - 1); ctx.stroke(); }

  ctx.save(); ctx.translate(0, top + 2); ctx.rotate(pin);
  ctx.strokeStyle = '#8a7a52'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -lerp(10, 22, unfold)); ctx.stroke();

  ctx.fillStyle = C.gold; ctx.beginPath(); ctx.arc(0, py, pr, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,240,200,0.7)'; ctx.beginPath(); ctx.arc(-pr * .35, py - pr * .35, pr * .3, 0, Math.PI * 2); ctx.fill();

// A hop: anticipation crouch, stretch in the air, squash on landing, settle.
function hop(t, t0, d = .9, h = 80) {
  const p = (t - t0) / d;
  if (p < 0 || p > 1.6) return { air: 0, sq: 1, land: false };
  if (p < .25) return { air: 0, sq: 1 - .22 * E.io(p / .25) };                       // anticipation
  if (p < .8) { const q = (p - .25) / .55; return { air: -h * 4 * q * (1 - q), sq: 1 + .2 * Math.abs(1 - 2 * q) + .02 }; } // stretch
  const q = (p - .8) / .8;
  return { air: 0, sq: 1 - .26 * Math.exp(-5 * q) * Math.cos(2 * Math.PI * 1.4 * q) };  // squash, settle
}
function hops(t, list) { // combine several hops
  let air = 0, sq = 1;
  for (const [t0, d, h] of list) { const r = hop(t, t0, d, h); air += r.air; sq *= r.sq; }
  return { air, sq };
}
function blinkAt(t, times) { let b = 0; for (const tb of times) b = Math.max(b, 1 - Math.abs(t - tb) / .09); return clamp(b); }

function header(lt, kick, title, o = {}) {
  const a = io(lt, .1, .7), dy = (1 - a) * 22;
  text(kick, 110, 116 + dy, { font: F.mono, size: 24, w: 600, c: o.kc || C.gold, a, ls: 3 });
  const a2 = io(lt, .3, .95);
  text(title, 107, 192 + (1 - a2) * 22, { font: F.serif, size: o.size || 68, c: C.ink, a: a2 });
}
function caption(s, lt, t0, y = 985, o = {}) {
  const a = io(lt, t0, t0 + .6) * (o.until ? 1 - io(lt, o.until, o.until + .5) : 1);
  if (a <= 0) return;
  text(s, o.x ?? 960, y + (1 - a) * 14, { size: o.size || 38, c: o.c || C.ink, a, align: o.align || 'center', font: o.font || F.sans, italic: o.italic, w: o.w });
}

const GRID = (() => {

  const cx = 960, cy = 560, rx = 650, ry = 270, hub = [960, 560];
  const node = i => { const an = -Math.PI / 2 + i / 34 * Math.PI * 2; return [cx + Math.cos(an) * rx, cy + Math.sin(an) * ry]; };
  const r = rng(3), bugged = new Set(); for (let i = 0; i < 34; i++) if (REPLAY[i][1] > 0) bugged.add(i);
  const delays = Array.from({ length: 34 }, () => r());
  // phase timings
  const A = [.6, 3.8], B = [4.0, 6.6], Cc = [6.8, 8.7], D = [8.9, 10.3], Ee = [10.4, 12];
  for (let i = 0; i < 34; i++) {
    const [x, y] = node(i), na = io(lt, .2 + i * .02, .7 + i * .02);
    const authored = lt > A[0] + .9 + delays[i] * 1.6 + 1.0, reviewed = lt > B[0] + .8 + delays[(i + 7) % 34] * 1.2 + .3;
    const wave = lt > Ee[0] ? Math.max(0, 1 - Math.abs(((lt - Ee[0]) * 1.6) % 1.4 - i / 34 * 1.2) * 6) : 0;
    circle(x, y, 32 + 6 * wave, C.card, authored ? C.gold : C.border, authored ? 3 : 2, na);
    if (reviewed) circle(x, y, 40 + 6 * wave, null, C.mint, 2.5, na * io(lt, B[0] + 1, B[0] + 1.6));
    if (wave > 0) glowDot(x, y, 70, C.gold, wave * .9);
    text(fid(i), x, y + 7, { font: F.mono, size: 18, w: 600, c: authored ? C.ink : C.muted, align: 'center', a: na });
    if (bugged.has(i)) {
      const bt = D[0] + (i / 34) * 1.1 + .4;
      const bs = back(lt, bt, bt + .4);
      if (bs > 0) { ctx.save(); ctx.translate(x + 26, y - 26); ctx.scale(bs, bs); circle(0, 0, 9, C.red); ctx.restore(); }
    }
  }
  // flyers: comet sprites with trails along arcs
  function flyer(from, to, t0, d, color, bend, trail = 6) {
    for (let k = trail; k >= 0; k--) {
      const p = E.io(prog(lt - k * .035, t0, t0 + d)); if (p <= 0 || prog(lt, t0, t0 + d) >= 1) continue;
      const [x, y] = arcPoint(from[0], from[1], to[0], to[1], bend, p);
      circle(x, y, k ? 6 - k * .7 : 8, color, null, 0, k ? .5 - k * .06 : 1);
    }
  }
  for (let i = 0; i < 34; i++) {
    flyer(hub, node(i), A[0] + delays[i] * 1.6, 1.0, C.gold, .25);
    flyer(hub, node(i), B[0] + delays[(i + 7) % 34] * 1.2, .8, C.mint, -.3);
    if (bugged.has(i)) flyer(hub, node(i), D[0] + (i / 34) * 1.1, .4, C.red, .15, 3);
  }
  // completeness critic orbits the whole map once
  let critic = null;
  if (lt > Cc[0] && lt < Cc[1]) {
    const p = E.io(prog(lt, Cc[0], Cc[1]));
    for (let k = 10; k >= 0; k--) {
      const an = -Math.PI / 2 + (p - k * .012) * Math.PI * 2;
      const x = cx + Math.cos(an) * (rx + 70), y = cy + Math.sin(an) * (ry + 60);
      circle(x, y, k ? 7 - k * .5 : 10, C.ink, null, 0, k ? .45 - k * .04 : 1);
      if (!k) critic = [x, y];
    }
  }
  // the map at the hub watches the work (secondary action)
  let look = [Math.sin(lt * 1.7) * .8, Math.cos(lt * 1.3) * .5];
  if (critic) { const dx = critic[0] - 960, dy = critic[1] - 520, m = Math.hypot(dx, dy); look = [dx / m, dy / m]; }
  const h = hops(lt, [[10.4, .8, 30]]);
  mappy({ x: 960, y: 640, s: .55, sq: h.sq, airY: h.air, look, blink: blinkAt(lt, [2.4, 5.2, 9.6]), pin: wobble(lt, 4.0, .25) + wobble(lt, 11.2, .3),
          mood: lt > 10.4 ? 'grin' : 'focus' });
  const caps = [[A, 'Author agents map each family and prove every recipe live', C.gold],
                [B, 'Independent reviewer agents re-drive each family on fresh servers', C.mint],
                [Cc, 'A completeness critic looks for gaps', C.ink],
                [D, 'A hardening pass adds explicit # bug assertions', C.red],
                [Ee, 'Then a full fresh replay of all 34 families', C.gold]];
  caps.forEach(([[a, b], s, c], i) => {
    const al = io(lt, a, a + .4) * (i < 4 ? 1 - io(lt, b, b + .3) : 1);
    if (al <= 0) return;
    circle(960 - measure(s, { size: 40 }) / 2 - 30, 972, 9, c, null, 0, al);
    text(s, 960, 985, { size: 40, c: C.ink, a: al, align: 'center' });
  });
});

    960, 1040, { size: 20, c: C.muted, a: io(lt, 5.6, 6.2) * .9, align: 'center' });
});

// ── timeline ──────────────────────────────────────────────────────────────
let acc = 0; for (const s of SHOTS) { s.t0 = acc; acc += s.dur; }
const DURATION = acc;
const FADE = .35;
function renderFrame(t) {
  background(t);
  for (const s of SHOTS) {
    if (t < s.t0 || t >= s.t0 + s.dur) continue;
    const lt = t - s.t0;
    s.draw(lt, s.dur);
    const env = Math.min(prog(lt, 0, FADE), 1 - prog(lt, s.dur - FADE, s.dur));
    if (env < 1) { ctx.save(); ctx.globalAlpha = 1 - E.io(env); ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  }
}
window.DURATION = DURATION;
window.SHOTS = SHOTS.map(s => ({ name: s.name, t0: s.t0, dur: s.dur }));
window.renderFrame = renderFrame;
window.ready = Promise.all([
  'normal 400 40px "Instrument Serif"', 'italic 400 40px "Instrument Serif"', '400 40px "DM Sans"', '500 40px "DM Sans"',
  '700 40px "DM Sans"', '400 40px "JetBrains Mono"', '600 40px "JetBrains Mono"',
].map(f => document.fonts.load(f))).then(() => document.fonts.ready).then(() => { renderFrame(0); return true; });
// Preview in a browser: ?t=12.5 shows one frame, ?play plays in real time.
const q = new URLSearchParams(location.search);
window.ready.then(() => {
  if (q.has('t')) renderFrame(parseFloat(q.get('t')));
  if (q.has('play')) { const st = performance.now(); const loop = () => { renderFrame(((performance.now() - st) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }
});
</script>
</body>
